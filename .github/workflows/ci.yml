name: CI

on:
  workflow_dispatch: {}
  # push/pull_request triggers disabled: GitHub Actions is blocked by an
  # account billing issue. Re-enable once that's resolved.
  # push:
  #   branches: [main]
  # pull_request:
  #   branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Type check (mypy)
        run: uv run mypy notes_agent/

      - name: Tests
        run: uv run pytest -v

      - name: Evals (guardrail e fidelidade)
        run: uv run python -m notes_agent eval
