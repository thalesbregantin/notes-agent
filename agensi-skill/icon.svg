<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="obsidianBg" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#4c1d95"/>
      <stop offset="60%" stop-color="#1e1035"/>
      <stop offset="100%" stop-color="#0b0614"/>
    </radialGradient>
    <linearGradient id="crystalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="40%" stop-color="#9333ea"/>
      <stop offset="100%" stop-color="#581c87"/>
    </linearGradient>
    <linearGradient id="facetLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e9d5ff"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="emeraldShield" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="purpleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="512" height="512" rx="96" fill="url(#obsidianBg)"/>
  <rect width="504" height="504" x="4" y="4" rx="92" fill="none" stroke="#9333ea" stroke-width="3" stroke-opacity="0.4"/>

  <!-- Network / Second Brain Graph Nodes (Background) -->
  <g stroke="#a855f7" stroke-width="2" stroke-opacity="0.3" stroke-dasharray="5,5">
    <line x1="100" y1="120" x2="256" y2="70"/>
    <line x1="412" y1="120" x2="256" y2="70"/>
    <line x1="90" y1="300" x2="160" y2="400"/>
    <line x1="422" y1="300" x2="352" y2="400"/>
    <line x1="100" y1="120" x2="90" y2="300"/>
    <line x1="412" y1="120" x2="422" y2="300"/>
  </g>
  <circle cx="100" cy="120" r="8" fill="#c084fc" filter="url(#purpleGlow)"/>
  <circle cx="412" cy="120" r="8" fill="#c084fc" filter="url(#purpleGlow)"/>
  <circle cx="256" cy="70" r="10" fill="#38bdf8" filter="url(#purpleGlow)"/>
  <circle cx="90" cy="300" r="7" fill="#34d399" filter="url(#purpleGlow)"/>
  <circle cx="422" cy="300" r="7" fill="#34d399" filter="url(#purpleGlow)"/>

  <!-- Central Obsidian Crystal Icon -->
  <g transform="translate(0, -10)">
    <!-- Main Crystal Facets -->
    <!-- Top Apex to Center -->
    <polygon points="256,110 330,220 256,260 182,220" fill="url(#facetLight)" filter="url(#purpleGlow)"/>
    <!-- Left Flank -->
    <polygon points="182,220 256,260 216,350 150,270" fill="url(#crystalGrad)"/>
    <!-- Right Flank -->
    <polygon points="330,220 362,270 296,350 256,260" fill="url(#crystalGrad)"/>
    <!-- Bottom Facet -->
    <polygon points="256,260 296,350 256,390 216,350" fill="#3b0764"/>
    
    <!-- Outer Glow Outline -->
    <polygon points="256,110 330,220 362,270 296,350 256,390 216,350 150,270 182,220" 
             fill="none" stroke="#f3e8ff" stroke-width="4" stroke-linejoin="round"/>
  </g>

  <!-- Security Shield & Checkmark Badge (Prompt Injection / Fidelity Defense) -->
  <g transform="translate(320, 290)">
    <circle cx="50" cy="50" r="42" fill="#0f172a" stroke="#34d399" stroke-width="4"/>
    <circle cx="50" cy="50" r="34" fill="url(#emeraldShield)"/>
    <!-- Checkmark icon -->
    <path d="M38,50 L46,58 L62,42" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Bottom Title Pill -->
  <rect x="90" y="420" width="332" height="42" rx="21" fill="#1e1035" stroke="#9333ea" stroke-width="2"/>
  <text x="256" y="447" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="800" fill="#f8fafc" text-anchor="middle" letter-spacing="3">OBSIDIAN NOTES AGENT</text>
  <circle cx="112" cy="441" r="5" fill="#c084fc"/>
  <circle cx="400" cy="441" r="5" fill="#34d399"/>
</svg>

