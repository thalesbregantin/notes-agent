[project]
name = "notes-agent"
version = "0.1.0"
description = "Agente que transforma texto e transcrições em notas do Obsidian, com saída estruturada, guardrail contra prompt injection e checagem de fidelidade"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.9"]

[project.optional-dependencies]
mcp = ["mcp>=2"]
graph = ["langgraph>=1"]

[dependency-groups]
dev = ["langgraph>=1", "mcp>=2", "mypy>=1.11", "pytest>=8", "ruff>=0.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
